		<main>
			<!-- Contact Form -->
			<div class="container">
				<form id="contactUsForm">
					<div class="form-group">
						<p class="text-lg">Send Us A Message</p>
						<p>
							Fill out the form bellow and we'll get back to you as soon as
							possible.
						</p>
					</div>
					<div class="form-group">
						<label class="bold">Name</label>
						<input id="contactName" placeholder="Your name" required />
					</div>
					<div class="form-group">
						<label class="bold">Email</label>
						<input
							id="contactEmail"
							placeholder="you@example.com"
							type="email"
							required />
					</div>
					<div class="form-group">
						<label class="bold">Subject</label>
						<input
							id="contactSubject"
							placeholder="Whats this about?"
							required />
					</div>
					<div class="form-group">
						<label class="bold">Message</label>
						<textarea
							id="contactMessage"
							rows="10"
							cols="50"
							required></textarea>
					</div>
					<div class="form-group">
						<button id="contactSubmitBtn" class="btn btn-primary" type="submit">
							Send Message
						</button>
					</div>
				</form>
			</div>
		</main>
